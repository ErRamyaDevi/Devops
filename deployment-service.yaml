apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-deployment
spec:
  selector:
    matchLabels:
      app: cicd
  replicas: 2
  template:
    metadata:
      labels:
        app: cicd
    spec:
      containers:
        - name: cicd
          image: rammyshak/project1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080


---

apiVersion: v1
kind: Service
metadata:
  name: cicd-ssvc
spec:
  selector:
    app: cicd
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080 
  type: LoadBalancer
